<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>纸上小日子 · 日记阅读器</title>  <script type="module" crossorigin src="./assets/index-Dwj5H_8L.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/style-BdWeJVjB.css">
</head>
<body><header><a class="brand" href="#cover"><b id="book-name">纸上小日子</b><span>把日常，慢慢翻开。</span></a><div class="header-actions"><button id="cover-edit">编辑封面</button><button id="contents-toggle">目录与检索</button></div></header>
<main><section class="heading"><div><p id="period-label"></p><h1 id="entry-title">纸上小日子</h1></div><button id="enlarge">放大原图 ↗</button></section>
<section class="stage" aria-label="三维翻页日记"><canvas id="book-scene" aria-label="拖动书角翻页，也可使用下方按钮"></canvas><div id="loading-card" hidden><span id="loading-copy"></span></div><p id="render-note" role="status"></p></section>
<footer><div id="entry-characters"></div><nav aria-label="翻页"><button id="previous-page" aria-label="上一页">←</button><span id="page-state" aria-live="polite">封面</span><button id="next-page" aria-label="下一页">→</button></nav><span class="hint">拖动书角 · 方向键翻页</span></footer>
<div id="library" hidden></div></main>
<dialog id="contents"><div class="dialog-head"><h2>翻到那一天</h2><button data-close>关闭</button></div><input id="search" type="search" placeholder="搜索日期、标题、内容或人物" aria-label="搜索日记"><div class="filters"><select id="period-filter" aria-label="时期"></select><select id="character-filter" aria-label="人物"></select><input id="date-filter" type="date" aria-label="日期"></div><div id="results"></div><p id="result-count" role="status"></p></dialog>
<dialog id="poster-dialog"><div class="dialog-head"><h2 id="poster-title">原图</h2><div><button id="zoom-toggle">原始尺寸</button><button data-close>关闭</button></div></div><div class="poster-scroll"><img id="poster-image" alt="日记完整海报"></div></dialog>
<dialog id="cover-editor" aria-labelledby="cover-heading"><div class="dialog-head"><h2 id="cover-heading">给日记本换个模样</h2><button data-close>关闭</button></div><div class="cover-layout"><canvas id="cover-preview" width="900" height="1200" aria-label="完整插画封面预览"></canvas><div class="cover-fields"><label for="cover-title">日记本的名字</label><input id="cover-title" maxlength="18" placeholder="纸上小日子"><label for="cover-upload">换一张喜欢的图片</label><input id="cover-upload" type="file" accept="image/png,image/jpeg,image/webp"><p>图片只保存在此浏览器，不会上传。完整显示图片，不使用异形蒙版，也不裁切主体。</p><p id="cover-status" role="status"></p><div class="cover-actions"><button id="cover-save">保存封面</button><button id="cover-reset">恢复默认</button></div></div></div></dialog></body></html>
