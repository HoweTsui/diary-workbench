<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>人物关系图</title>
  <style>
    @font-face {
      font-family: "Yozai";
      src: url("fonts/Yozai-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Yozai";
      src: url("fonts/Yozai-Medium.ttf") format("truetype");
      font-weight: 500 700;
      font-style: normal;
    }
    :root {
      color-scheme: light;
      --paper: #ffffff;
      --ink: #171715;
      --muted: #171715;
      --rule: rgba(124, 207, 223, 0.24);
      --border: rgba(23, 23, 21, 0.24);
      --accent: #171715;
      --relationship: #171715;
      --panel: rgba(255, 255, 255, 0.96);
      --ui-font: "Yozai", sans-serif;
      --hand-font: "Yozai", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--ui-font);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button,
    select,
    input,
    textarea {
      color: var(--ink);
    }

    .app {
      display: grid;
      grid-template-columns: minmax(0, 1fr) clamp(330px, 27vw, 408px);
      width: 100%;
      height: 100%;
    }

    .graph-pane {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background:
        repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent 39px,
          var(--rule) 40px,
          transparent 41px
        ),
        var(--paper);
      border-right: 2px solid var(--ink);
    }

    .graph-pane::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      left: 54px;
      width: 1px;
      background: transparent;
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      z-index: 4;
      inset: 24px 24px auto 28px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 22px;
      pointer-events: none;
    }

    .brand {
      flex: 0 0 auto;
      min-width: 208px;
      pointer-events: auto;
    }

    .brand h1 {
      position: relative;
      z-index: 0;
      display: inline-block;
      margin: 0;
      font-family: var(--hand-font);
      font-size: clamp(30px, 3vw, 46px);
      font-weight: 700;
      line-height: 1.06;
      letter-spacing: 0.04em;
    }

    .brand h1::after {
      content: "";
      position: absolute;
      z-index: -1;
      right: -8px;
      bottom: 2px;
      left: -5px;
      height: 8px;
      border-radius: 50%;
      background: transparent;
      transform: rotate(-1deg);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      pointer-events: auto;
    }

    .control {
      height: 44px;
      border: 1.5px solid var(--ink);
      border-radius: 9px 11px 8px 10px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 2px 2px 0 rgba(23, 23, 21, 0.12);
    }

    .search {
      position: relative;
      width: min(260px, 24vw);
    }

    .search svg {
      position: absolute;
      top: 12px;
      left: 13px;
      width: 19px;
      height: 19px;
      pointer-events: none;
    }

    .search input {
      width: 100%;
      height: 100%;
      padding: 0 14px 0 40px;
      border: 0;
      outline: 0;
      background: transparent;
      font-size: 14px;
    }

    .search input::placeholder {
      color: #8d8a82;
    }

    .filter {
      min-width: 128px;
      padding: 0 34px 0 13px;
      appearance: none;
      background-color: rgba(255, 255, 255, 0.96);
      background-image:
        linear-gradient(45deg, transparent 50%, var(--ink) 50%),
        linear-gradient(135deg, var(--ink) 50%, transparent 50%);
      background-position:
        calc(100% - 16px) 18px,
        calc(100% - 11px) 18px;
      background-repeat: no-repeat;
      background-size: 5px 5px, 5px 5px;
      cursor: pointer;
      font-size: 14px;
    }

    .icon-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-width: 82px;
      padding: 0 13px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 650;
    }

    .icon-button svg {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
    }

    .history-button {
      min-width: 44px;
      width: 44px;
      padding: 0;
    }

    .control:disabled {
      cursor: not-allowed;
      opacity: 0.42;
      transform: none;
      box-shadow: 2px 2px 0 rgba(23, 23, 21, 0.07);
    }

    .control:focus-visible {
      outline: 3px solid var(--ink);
      outline-offset: 2px;
    }

    .control:hover {
      transform: translateY(-1px);
      box-shadow: 3px 4px 0 rgba(23, 23, 21, 0.12);
    }

    .graph-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    .graph-canvas.dragging {
      cursor: grabbing;
    }

    .graph-canvas.connecting,
    .graph-canvas.detaching {
      cursor: crosshair;
    }

    .graph-canvas.label-hover {
      cursor: text;
    }

    .edge-label-editor {
      position: absolute;
      z-index: 6;
      min-width: 68px;
      height: 34px;
      padding: 3px 9px;
      border: 2px solid var(--ink);
      border-radius: 9px;
      outline: 0;
      background: #ffffff;
      box-shadow: 3px 4px 0 rgba(23, 23, 21, 0.14);
      font-family: var(--hand-font);
      font-weight: 700;
      line-height: 1;
      text-align: center;
      transform: translate(-50%, -50%);
    }

    .edge-label-editor:focus {
      box-shadow: 0 0 0 4px rgba(23, 23, 21, 0.12), 3px 4px 0 rgba(23, 23, 21, 0.14);
    }

    .hint {
      position: absolute;
      z-index: 4;
      bottom: 22px;
      left: 30px;
      padding: 8px 11px 7px;
      border-bottom: 4px solid var(--ink);
      background: rgba(255, 255, 255, 0.9);
      font-family: var(--hand-font);
      font-size: 15px;
      pointer-events: none;
    }

    .inspector {
      position: relative;
      z-index: 6;
      overflow: auto;
      padding: 24px 24px 32px;
      background: var(--panel);
    }

    .inspector-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      border-bottom: 1.5px solid var(--ink);
    }

    .inspector-header h2 {
      position: relative;
      z-index: 0;
      margin: 0;
      font-family: var(--hand-font);
      font-size: 28px;
      line-height: 1;
    }

    .inspector-header h2::after {
      content: "";
      position: absolute;
      z-index: -1;
      right: -3px;
      bottom: -4px;
      left: -2px;
      height: 6px;
      border-radius: 50%;
      background: transparent;
    }

    .inspector-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .edit-toggle {
      min-height: 36px;
      padding: 0 11px;
      border: 1.5px solid var(--ink);
      border-radius: 7px 9px 7px 8px;
      background: var(--paper);
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .edit-toggle[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }

    .close-inspector {
      display: none;
      width: 36px;
      height: 36px;
      padding: 0;
      border: 1.5px solid var(--ink);
      border-radius: 50%;
      background: var(--paper);
      cursor: pointer;
    }

    .profile {
      display: grid;
      grid-template-columns: 94px minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      padding: 22px 0 18px;
    }

    .profile-avatar {
      display: grid;
      place-items: center;
      width: 94px;
      height: 94px;
      aspect-ratio: 1 / 1;
      border: 2px solid var(--ink);
      border-radius: 50%;
      background-color: white;
      background-image: none;
      background-repeat: no-repeat;
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 0 5px rgba(23, 23, 21, 0.12);
      font-family: var(--hand-font);
      font-size: 32px;
      font-weight: 700;
    }

    .profile-name {
      margin: 0 0 4px;
      font-family: var(--hand-font);
      font-size: 32px;
      line-height: 1;
    }

    .profile-role {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .editor {
      display: grid;
      gap: 14px;
      padding: 18px 0;
      border-top: 1px solid var(--border);
    }

    .details-view {
      display: grid;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field > span {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1.5px solid var(--ink);
      border-radius: 7px 9px 7px 8px;
      outline: 0;
      background: #fff;
      font-size: 13px;
      line-height: 1.5;
    }

    .field input,
    .field select {
      min-height: 40px;
      padding: 0 10px;
    }

    .field textarea {
      min-height: 72px;
      padding: 9px 10px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      box-shadow: 0 0 0 3px rgba(23, 23, 21, 0.16);
    }

    .field-help {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.4;
    }

    .form-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .action-button {
      min-height: 38px;
      padding: 0 12px;
      border: 1.5px solid var(--ink);
      border-radius: 7px 9px 7px 8px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .action-button.primary {
      background: var(--ink);
      color: #fff;
    }

    .action-button.danger {
      margin-left: auto;
      border-style: dashed;
    }

    .action-button:hover,
    .relation-remove:hover {
      transform: translateY(-1px);
      box-shadow: 2px 2px 0 rgba(23, 23, 21, 0.14);
    }

    .save-status {
      min-height: 18px;
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }

    .info-section {
      padding: 18px 0;
      border-top: 1px solid var(--border);
    }

    .info-section h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      font-family: var(--hand-font);
      font-size: 19px;
    }

    .info-section h3::before {
      content: "✦";
      color: var(--accent);
      font-family: var(--ui-font);
      font-size: 16px;
    }

    .info-section.relationships h3::before {
      content: "♥";
      color: var(--relationship);
    }

    .info-list {
      margin: 0;
      padding: 0 0 0 20px;
      color: #353430;
      font-size: 13px;
      line-height: 1.8;
    }

    .relation-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
      font-size: 13px;
    }

    .relation-list li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 7px 0;
      border-bottom: 1px dashed var(--border);
    }

    .relation-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .relation-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .relation-target {
      color: var(--muted);
    }

    .relation-copy {
      display: grid;
      flex: 1;
      gap: 2px;
      min-width: 0;
    }

    .relation-remove {
      flex: 0 0 auto;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 1px solid var(--ink);
      border-radius: 50%;
      background: #fff;
      cursor: pointer;
      line-height: 1;
    }

    .relation-editor {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(72px, 0.65fr);
      gap: 8px;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .relation-editor .wide {
      grid-column: 1 / -1;
    }

    .relation-editor .action-button {
      grid-column: 1 / -1;
    }

    .empty-note {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
    }

    .mobile-inspector {
      display: none;
    }

    @media (max-width: 900px) {
      .app {
        display: block;
      }

      .graph-pane {
        width: 100%;
        height: 100%;
        border-right: 0;
      }

      .topbar {
        inset: 18px 16px auto 20px;
        align-items: flex-start;
      }

      .brand {
        min-width: 160px;
      }

      .brand h1 {
        font-size: 31px;
      }

      .toolbar {
        max-width: 56%;
        flex-wrap: wrap;
        gap: 7px;
      }

      .search {
        width: min(240px, 48vw);
      }

      .filter {
        min-width: 112px;
      }

      .mobile-inspector {
        display: inline-flex;
      }

      .inspector {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: min(408px, 92vw);
        border-left: 2px solid var(--ink);
        box-shadow: -16px 0 40px rgba(23, 23, 21, 0.12);
        transform: translateX(105%);
        transition: transform 180ms ease;
      }

      .inspector.open {
        transform: translateX(0);
      }

      .close-inspector {
        display: inline-grid;
        place-items: center;
      }
    }

    @media (max-width: 620px) {
      .topbar {
        display: block;
      }

      .brand h1 {
        font-size: 28px;
      }

      .toolbar {
        justify-content: flex-start;
        max-width: none;
        margin-top: 12px;
      }

      .search {
        width: calc(100vw - 40px);
      }

      .control {
        height: 40px;
      }

      .search svg {
        top: 10px;
      }

      .filter {
        background-position:
          calc(100% - 16px) 16px,
          calc(100% - 11px) 16px;
      }

      .hint {
        right: 16px;
        bottom: 14px;
        left: 16px;
        text-align: center;
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .inspector,
      .control {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="graph-pane" id="graph-pane" aria-label="可拖拽人物关系图">
      <header class="topbar">
        <div class="brand">
          <h1>人物关系图</h1>
        </div>

        <div class="toolbar" aria-label="图谱工具">
          <label class="search control">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-4-4"></path>
            </svg>
            <input id="search" type="search" placeholder="搜索人物" autocomplete="off" aria-label="搜索人物">
          </label>

          <select id="relation-filter" class="filter control" aria-label="筛选关系">
            <option value="all">关系：全部</option>
            <option value="close">关系：亲密</option>
            <option value="family">关系：家庭</option>
            <option value="work">关系：工作</option>
          </select>

          <button id="add-node" class="icon-button control" type="button" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="9" cy="8" r="3"></circle>
              <path d="M3 20c.7-4 2.7-6 6-6 1.5 0 2.8.4 3.8 1.2"></path>
              <path d="M18 12v8M14 16h8"></path>
            </svg>
            新增
          </button>

          <button id="auto-layout" class="icon-button control" type="button" aria-label="一键智能编排人物关系图" title="一键智能编排">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="6" cy="6" r="2"></circle>
              <circle cx="18" cy="6" r="2"></circle>
              <circle cx="12" cy="18" r="2"></circle>
              <path d="M7.7 7.2 10.4 16M16.3 7.2 13.6 16M8 6h8"></path>
            </svg>
            编排
          </button>

          <button id="undo-layout" class="icon-button history-button control" type="button" aria-label="撤销编排或位置调整" title="撤销" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 7 4 12l5 5"></path>
              <path d="M5 12h9a6 6 0 1 1 0 12"></path>
            </svg>
          </button>

          <button id="redo-layout" class="icon-button history-button control" type="button" aria-label="重做编排或位置调整" title="重做" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m15 7 5 5-5 5"></path>
              <path d="M19 12h-9a6 6 0 1 0 0 12"></path>
            </svg>
          </button>

          <button id="reset" class="icon-button control" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M4 4v6h6"></path>
              <path d="M5.5 15a7 7 0 1 0 1.2-7.8L4 10"></path>
            </svg>
            复位
          </button>

          <button id="show-inspector" class="icon-button control mobile-inspector" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="8" r="3"></circle>
              <path d="M5 21c.8-4 3.1-6 7-6s6.2 2 7 6"></path>
            </svg>
            人物卡
          </button>
        </div>
      </header>

      <canvas id="graph-canvas" class="graph-canvas" tabindex="0">
        当前浏览器不支持 Canvas，无法显示人物关系图。
      </canvas>

      <input
        id="edge-label-editor"
        class="edge-label-editor"
        type="text"
        maxlength="12"
        autocomplete="off"
        aria-label="编辑关系名称"
        hidden
      >

      <div id="graph-hint" class="hint">拖拽节点 · 滚轮缩放 · 空白处平移</div>
    </section>

    <aside class="inspector" id="inspector" aria-label="人物卡">
      <div class="inspector-header">
        <h2>人物卡</h2>
        <div class="inspector-actions">
          <button id="edit-toggle" class="edit-toggle" type="button" aria-pressed="false">编辑</button>
          <button id="close-inspector" class="close-inspector" type="button" aria-label="关闭人物卡">×</button>
        </div>
      </div>

      <div class="profile">
        <div id="profile-avatar" class="profile-avatar" role="img" aria-label="人物头像"></div>
        <div>
          <h3 id="profile-name" class="profile-name">选择人物</h3>
          <p id="profile-role" class="profile-role">从图谱中选择人物查看详情</p>
        </div>
      </div>

      <div id="person-details" class="details-view">
        <section class="info-section">
          <h3>人物档案</h3>
          <p id="approval-copy" class="empty-note"></p>
          <ul id="appearance-list" class="info-list"></ul>
        </section>

        <section class="info-section">
          <h3>人物标准卡</h3>
          <img id="standard-card" alt="" hidden style="width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;">
          <p id="standard-card-empty" class="empty-note"></p>
        </section>

        <section class="info-section">
          <h3>首次出现</h3>
          <p id="first-appearance" class="empty-note"></p>
        </section>

        <section class="info-section">
          <h3>外观锚点</h3>
          <ul id="anchor-list" class="info-list"></ul>
        </section>

        <section class="info-section">
          <h3>人物备注</h3>
          <ul id="notes-list" class="info-list"></ul>
        </section>
      </div>

      <form id="person-form" class="editor" hidden>
        <label class="field">
          <span>姓名</span>
          <input id="edit-name" name="name" maxlength="20" required autocomplete="off">
        </label>

        <label class="field">
          <span>身份说明</span>
          <input id="edit-role" name="role" maxlength="80" autocomplete="off">
        </label>

        <label class="field">
          <span>独立 1:1 头像路径</span>
          <input id="edit-avatar-src" name="avatarSrc" maxlength="240" autocomplete="off" placeholder="avatars/角色ID.png">
          <small class="field-help">相对本 HTML 的方形 PNG；上半身完整、水平居中、四周留白。留空会回退人物图集。</small>
        </label>

        <label class="field">
          <span>外观锚点</span>
          <textarea id="edit-anchors" name="anchors" maxlength="300"></textarea>
          <small class="field-help">每行一个特征；姓名、鼻型与朝向、发丝、黑块和鞋形尽量固定。</small>
        </label>

        <label class="field">
          <span>人物备注</span>
          <textarea id="edit-notes" name="notes" maxlength="400"></textarea>

  <script>
    (function () {
      "use strict";

      var graphData = JSON.parse(document.getElementById("graph-data").textContent);
      var atlasCols = graphData.atlas.cols;
      var atlasRows = graphData.atlas.rows;
      var atlasSrc = graphData.atlas.src || "character-lineup.png";
      var atlas = new Image();
      atlas.src = atlasSrc;

      var seedNodes = graphData.nodes;
      var seedEdges = graphData.edges;
      var initialPositionById = new Map(seedNodes.map(function (node) {
        return [node.id, [node.x, node.y]];
      }));

      function datasetHash(value) {
        var text = JSON.stringify(value);
        var hash = 2166136261;
        for (var index = 0; index < text.length; index += 1) {
          hash ^= text.charCodeAt(index);
          hash = Math.imul(hash, 16777619);
        }
        return (hash >>> 0).toString(36);
      }

      var STORAGE_KEY = "cartoon-diary-journal.character-graph.v3." + datasetHash(graphData);
      var storedState = null;
      try {
        storedState = JSON.parse(window.localStorage.getItem(STORAGE_KEY));
        if (!storedState || !Array.isArray(storedState.nodes) ||
            !storedState.nodes.length || !Array.isArray(storedState.edges)) {
          storedState = null;
        }
      } catch (error) {
        storedState = null;
      }

      var nodes = storedState ? storedState.nodes : JSON.parse(JSON.stringify(seedNodes));
      var edges = storedState ? storedState.edges : JSON.parse(JSON.stringify(seedEdges));
      if (storedState) {
        var seedNodeById = new Map(seedNodes.map(function (node) {
          return [node.id, node];
        }));
        // Position edits may persist locally, but atlas coordinates are part of the
        // current dataset and must always come from the current graph data.
        nodes = nodes.map(function (node) {
          var seed = seedNodeById.get(node.id);
          if (!seed) {
            return node;
          }
          ["col", "row", "avatarSrc", "avatarFocusX", "avatarFocusY"].forEach(function (key) {
            if (Object.prototype.hasOwnProperty.call(seed, key)) {
              node[key] = seed[key];
            }
          });
          return node;
        });
      }
      var nodeById = new Map();

      function rebuildNodeIndex() {
        nodeById = new Map(nodes.map(function (node) {
          return [node.id, node];
        }));

          return nodeById.has(edge.source) && nodeById.has(edge.target);
        });
      }

      rebuildNodeIndex();

      var requestedCharacterId = null;

      var canvas = document.getElementById("graph-canvas");

        statusTimer = window.setTimeout(function () {

      function saveState(message) {

            nodes: nodes,
